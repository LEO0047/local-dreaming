[project]
name = "local-dreaming"
version = "0.1.0"
description = "A practical, locally governed long-term memory service for Codex."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "mcp==1.28.1",
  "pydantic==2.13.4",
  "typer>=0.16,<1",
]

[project.scripts]
dream = "local_dreaming.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["local_dreaming"]
mypy_path = "src"
